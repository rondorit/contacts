plugins {
    id 'com.android.application'
}

android {
    namespace 'com.clientcaller.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.clientcaller.app'
        minSdk 26
        targetSdk 34
        versionCode 37
        versionName '3.7'
    }

    // Fixed signing key so new versions install over old ones (your imported data is kept).
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES', 'META-INF/versions/**']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    // Reads Microsoft Access (.accdb / .mdb) files
    implementation 'com.healthmarketscience.jackcess:jackcess:4.0.5'
}
