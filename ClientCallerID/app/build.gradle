plugins {
    id 'com.android.application'
}

android {
    namespace 'com.clientcaller.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.clientcaller.app'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '2.0'
    }

    // Fixed signing key so new versions install over old ones (your imported data is kept).
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
