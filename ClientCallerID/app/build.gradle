plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    // The user guide (docs/guide/user-guide.html) is bundled so it opens inside the app.
    sourceSets {
        main {
            assets.srcDirs += ['../../docs/guide']
        }
    }

    namespace 'com.clientcaller.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.clientcaller.app'
        minSdk 26
        targetSdk 34
        versionCode 92
        versionName '8.2-cloud-preview'
    }

    // Fixed signing key so new versions install over old ones (your imported data is kept).
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES', 'META-INF/versions/**']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    // Reads Microsoft Access (.accdb / .mdb) files
    implementation 'com.healthmarketscience.jackcess:jackcess:4.0.5'
    // Barcode / QR scanner (UI provided by Google Play services)
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    // Geofencing for location-based task reminders
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    // Cloud (multi-user): Firebase sign-in with Google + Firestore
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
}
