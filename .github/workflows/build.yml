name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ClientCallerID
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: |
          gradle assembleDebug --no-daemon > build.log 2>&1 || { grep -E "error:|FAILED|What went wrong" -A3 build.log | head -40 | sed 's/^/::error::/'; exit 1; }
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ClientCallerID.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ClientCallerID.apk --target "${{ github.sha }}" --title "Client Caller ID" --notes "Tap ClientCallerID.apk to download and install."
