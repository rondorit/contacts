name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ClientCallerID
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: |
          gradle assembleDebug --no-daemon > build.log 2>&1 || { grep -E "error:|FAILED|What went wrong" -A3 build.log | head -40 | sed 's/^/::error::/'; exit 1; }
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ClientCallerID.apk
          if [ "${{ github.ref_name }}" = "main" ]; then TAG=latest; TITLE="Client Caller ID"; EXTRA=""; else TAG=preview; TITLE="Preview (${{ github.ref_name }})"; EXTRA="--prerelease"; fi
          gh release delete $TAG --yes --cleanup-tag || true
          gh release create $TAG ClientCallerID.apk ../docs/guide/user-guide.pdf ../docs/guide/user-guide.html --target "${{ github.sha }}" --title "$TITLE" $EXTRA --notes "Tap ClientCallerID.apk to download and install. User guide: user-guide.pdf / user-guide.html"
